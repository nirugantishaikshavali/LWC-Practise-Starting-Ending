trigger:
  - dev

variables:
  - group: Dev2Secrets

pool:
  vmImage: ubuntu-latest

steps:
  # Checkout Repository
  - checkout: self

  # Install Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: "18.x"
    displayName: Install Node.js

  # Install Salesforce CLI
  - script: |
      npm install --global sfdx-cli
    displayName: Install Salesforce CLI

  # Verify Salesforce CLI
  - script: |
      sfdx --version
    displayName: Verify Salesforce CLI

  # Authenticate DEV Sandbox
  - script: |
      sfdx force:auth:jwt:grant \
        --clientid "$(SF_CLIENT_ID)" \
        --jwtkeyfile keys/server.key \
        --username "$(SF_USERNAME)" \
        --instanceurl https://test.salesforce.com \
        --setdefaultusername \
        --setalias dev2Sandbox
    displayName: Authenticate DEV2 Sandbox

  # Verify Connected Org
  - script: |
      sfdx force:org:list
    displayName: Verify Org's Login

  # Deploy Metadata
  - script: |
      sfdx force:source:deploy \
        -p force-app \
        -u dev2Sandbox
    displayName: Deploy Metadata
