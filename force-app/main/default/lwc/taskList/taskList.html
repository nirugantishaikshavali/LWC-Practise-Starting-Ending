<template>

    <lightning-card title="Task List">

        <template
            for:each={tasks}
            for:item="task">

            <div
                key={task.id}
                class="slds-box slds-m-around_small">

                <span>
                    {task.task}
                </span>

                <lightning-button-icon
                    icon-name="utility:delete"
                    data-id={task.id}
                    onclick={deleteHandler}>
                </lightning-button-icon>

            </div>

        </template>

    </lightning-card>

</template>
